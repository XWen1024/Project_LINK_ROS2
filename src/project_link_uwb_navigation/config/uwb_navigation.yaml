uwb_serial_node:
  ros__parameters:
    device: ""
    baudrate: 115200
    tag_address: ""
    source_id: "tag-1"
    sensor_frame: "uwb_sensor"
    observation_topic: "/uwb/person_observation"
    status_topic: "/uwb/status"
    max_payload_bytes: 4096
    max_coordinate_m: 30.0
    max_range_m: 30.0
    # Replace from the installed static calibration distribution.
    max_range_residual_m: 0.50
    serial_timeout_sec: 0.10

uwb_nav2_server:
  ros__parameters:
    # Live motion is enabled only by the guarded launcher after operator confirmation.
    enable_motion: false
    observation_topic: "/uwb/person_observation"
    proposed_goal_topic: "/uwb_navigation/proposed_goal"
    status_topic: "/uwb_navigation/status"
    person_action_name: "/uwb_navigation/person_navigation"
    stop_service_name: "/uwb_navigation/stop"
    nav2_action_name: "/navigate_to_pose"
    map_frame: "map"
    base_frame: "base_footprint"
    source_id: "tag-1"
    update_rate_hz: 5.0
    acquisition_count: 5
    acquisition_timeout_sec: 8.0
    uwb_ttl_sec: 0.50
    slam_ttl_sec: 0.30
    cancel_timeout_sec: 2.0
    goal_response_timeout_sec: 2.0
    goal_displacement_m: 0.20
    goal_refresh_sec: 0.75
    max_target_speed_mps: 3.0

    # Summon stops closer than follow, but remains outside the chassis footprint.
    summon_distance_m: 1.0
    summon_min_distance_m: 0.75
    summon_arrival_distance_m: 1.15
    follow_distance_m: 1.5
    follow_min_distance_m: 1.3
    follow_hold_distance_m: 1.7

    # These values are deliberately locked. Replace them with an approved,
    # measured BU04-to-base_footprint calibration before live motion.
    calibration_status: invalid
    calibration_version: "unapproved"
    axis_xx: 1.0
    axis_xy: 0.0
    axis_yx: 0.0
    axis_yy: 1.0
    sensor_yaw_rad: 0.0
    sensor_translation_x_m: 0.0
    sensor_translation_y_m: 0.0

    cmd_vel_topic: "/cmd_vel"
    allowed_cmd_vel_publishers: ["velocity_smoother", "behavior_server"]
