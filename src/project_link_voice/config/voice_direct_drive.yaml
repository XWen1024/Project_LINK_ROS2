voice_dialog_node:
  ros__parameters:
    # Start with false. Set true only during a supervised, physically safe motion test.
    enable_motion: false
    enable_audio: true
    wakeup_only: false
    # auto enters pure test mode when no /map, /scan, or /odom topics are present.
    # Use "on" to force voice-only testing, or "off" for production-only behavior.
    pure_test_mode: auto
    pure_test_auto_delay_sec: 3.0
    keyboard_wakeup: false
    wakeup_serial_port: /dev/serial/by-id/usb-WCH.CN_USB_Single_Serial_0004-if00
    wakeup_serial_baud: 115200
    # Empty string accepts any serial data. COM9 AIUI modules also emit heartbeat frames,
    # so the default only treats AIUI event frames as wakeups.
    wakeup_match_text: aiui_event
    wakeup_serial_max_buffer_bytes: 16384
    wakeup_log_raw: false
    wakeup_ack_text: 我在，请说。
    wakeup_ack_cache_file: ~/.cache/project_link_voice/wakeup_ack.mp3
    wakeup_ack_cache_timeout_sec: 20.0
    wakeup_ack_playback_timeout_sec: 5.0
    waiting_prompt_text: 好的。
    waiting_prompt_cache_file: ~/.cache/project_link_voice/waiting_okay.mp3
    waiting_prompt_delay_ms: 500
    waiting_prompt_playback_timeout_sec: 2.0
    target_frame: map
    base_frame: base_footprint
    navigation_backend: direct_drive
    nav2_action_name: /navigate_to_pose
    navigation_timeout_sec: 180.0
    nav2_behavior_tree: ""
    nav2_cmd_vel_topic: /cmd_vel
    nav2_allowed_cmd_vel_publishers:
      - velocity_smoother
      - behavior_server
    # Example: /home/wte/.ros/project_link_voice/waypoints.json
    waypoints_override_file: ""
    funvad_device: cuda
    audio_sample_rate: 16000
    audio_capture_frame_ms: 20
    audio_chunk_ms: 200
    audio_pre_roll_ms: 400
    audio_end_silence_ms: 500
    audio_no_speech_timeout_sec: 8.0
    audio_max_utterance_sec: 12.0
    audio_min_speech_sec: 0.30
    # USB replug changes PyAudio indexes; select the iFlytek microphone by name.
    audio_input_device_index: -1
    audio_input_device_name: XFM-DP-V0.0.18
    whisper_device: cuda
    whisper_compute_type: float16
    # Provider, Volcano endpoint, and ASR resource ID come from voice_api.env.
    # Omitting them here preserves PROJECT_LINK_ASR_PROVIDER and VOLCANO_ASR_*.
    volcano_asr_packet_ms: 100
    volcano_asr_final_timeout_sec: 2.0
    volcano_asr_connect_timeout_sec: 5.0
    volcano_asr_max_buffer_sec: 4.0
    volcano_asr_enable_nonstream: false
    volcano_asr_publish_partials: false
    # Defaults to the official DeepSeek OpenAI-compatible API.
    enable_llm_tools: true
    llm_api_key_env: DEEPSEEK_API_KEY
    llm_base_url: https://api.deepseek.com
    llm_model: deepseek-v4-flash
    confirmation_timeout_sec: 30.0
    # Emergency demo-only short /cmd_vel motions. Production launches keep this false.
    enable_demo_motion: false
    demo_cmd_vel_topic: /cmd_vel
    demo_linear_mps: 0.08
    demo_angular_rps: 0.35
    demo_step_sec: 1.0
    demo_turn_sec: 1.2
    demo_spin_sec: 5.5
    tts_enabled: true
    tts_sample_rate: 24000
    tts_mixer_buffer_samples: 512
    tts_stream_audio_chunk_ms: 60
    tts_dynamic_cache_ttl_sec: 900.0
    tts_dynamic_cache_max_entries: 64
    tts_dynamic_cache_max_bytes: 16777216
    tts_persistent_cache_dir: ~/.cache/project_link_voice/fixed_phrases
    tts_persistent_phrases:
      - 好的。
      - 已停止。
      - 没有听到有效语音，我先休息了。
      - 没有识别到有效指令。
    # Credentials come only from /home/wte/.config/project_link/voice_api.env.
    volcano_resource_id: seed-tts-2.0
    volcano_speaker: ""
    tts_output_device: alsa_output.usb-C-Media_Electronics_Inc._USB_Audio_Device-00.analog-stereo
    # Per-interaction JSONL diagnostics. Timing phases are also printed with [VOICE_TIMING].
    debug_logging_enabled: true
    timing_debug_enabled: true
    timing_console_enabled: true
    debug_log_file: ~/.ros/project_link_voice/voice_debug.jsonl
    timing_log_file: ~/.ros/project_link_voice/voice_timing.jsonl
    # Keep false until the robot is at a verified safe grasp pose and SO-101 space is clear.
    enable_visual_grasp: false
    visual_grasp_timeout_sec: 45.0
    visual_grasp_prepare_arm: true
    visual_grasp_action_name: /visual_grasp/track_and_grasp
    visual_grasp_connect_service: /visual_grasp/connect_arm
    visual_grasp_torque_service: /visual_grasp/set_torque
    visual_grasp_stop_service: /visual_grasp/stop
    grasp_target_aliases:
      - 药瓶=medicine bottle
      - 药=medicine bottle
      - 水杯=red cup
      - 杯子=cup

voice_tts_node:
  ros__parameters:
    tts_enabled: true
    tts_sample_rate: 24000
    volcano_resource_id: seed-tts-2.0
    volcano_speaker: ""
    tts_output_device: alsa_output.usb-C-Media_Electronics_Inc._USB_Audio_Device-00.analog-stereo

ab_drive_server:
  ros__parameters:
    cmd_vel_topic: /cmd_vel
    target_frame: map
    base_frame: base_footprint
    control_rate_hz: 20.0
    goal_tolerance_m: 0.08
    max_goal_distance_m: 3.0
    max_motion_sec: 30.0
    max_linear_mps: 0.08
    max_angular_rps: 0.35
    linear_gain: 0.45
    angular_gain: 1.2
    stop_linear_angle_rad: 0.8
    command_watchdog_sec: 0.5
